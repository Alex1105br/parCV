{% extends "base.html" %}

{% block title %}Análise de Currículo - IA Currículos{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='analisar.css') }}">
{% endblock %}

{% block body %}
<header class="header">
    <a href="/" class="header__back" aria-label="Voltar para a página inicial">⬅ Voltar</a>
    <h1 class="header__title">🔎 Análise de Currículo (ATS)</h1>
</header>

<main class="analisar">
    <section class="analisar__form" aria-label="Formulário de análise">
        <div class="form-group">
            <label for="ats-file" class="form-label">Currículo (PDF ou TXT)</label>
            <input type="file" id="ats-file" class="form-input" accept=".pdf,.txt">
        </div>

        <div class="form-group">
            <label for="ats-vaga" class="form-label">Descrição da vaga (opcional)</label>
            <textarea id="ats-vaga" class="form-textarea" placeholder="Cole a descrição da vaga aqui..."></textarea>
        </div>

        <button type="button" class="btn btn--primary btn--block" id="btn-analisar">Analisar currículo</button>

        <div id="loader" class="loader hidden" aria-live="polite">
            <span class="loader__spinner"></span>
            <span>Analisando...</span>
        </div>
    </section>

    <section class="analisar__resultado" id="resultado" aria-live="polite" aria-label="Resultado da análise"></section>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='analisar.js') }}"></script>
{% endblock %}
