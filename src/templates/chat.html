<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA Local — Qwen 2.5</title>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="/" class="home-link" title="Voltar para a página inicial">⌂</a>
            <h1>Chat IA Local — Qwen 2.5</h1>
        </div>
        <div class="actions">
            <button class="btn btn-danger" onclick="limparChat()">Limpar chat</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="welcome" id="welcome">
            <h2>Bem-vindo ao Chat IA Local</h2>
            <p>Digite uma mensagem ou envie um documento (.txt / .pdf) para começar.</p>
        </div>
    </div>

    <div id="input-area">
        <label for="file-input" class="upload-btn" title="Enviar documento">📎</label>
        <input type="file" id="file-input" accept=".txt,.pdf" onchange="handleFileSelect(this)">
        <span id="file-name" class="file-name"></span>
        <input type="text" id="msg-input" placeholder="Digite sua mensagem..." autocomplete="off" onkeydown="if(event.key==='Enter') enviarMensagem()">
        <button type="button" id="send-btn" onclick="enviarMensagem()">Enviar</button>
    </div>

    <link rel="stylesheet" href="../static/chat.css">
    <script src="../static/chat.js"></script>
    
</body>
</html>
