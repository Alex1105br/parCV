<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA Local — Qwen 2.5</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #0f3460;
        }

        header h1 {
            font-size: 18px;
            color: #e94560;
        }

        header .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #1a1a5e;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn:hover { background: #1a1a5e; }
        .btn-danger { background: #8b0000; border-color: #a00; }
        .btn-danger:hover { background: #a00; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #0f3460;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #16213e;
            border-bottom-left-radius: 4px;
        }

        .message .tempo {
            font-size: 11px;
            color: #888;
            margin-top: 6px;
        }

        .message.system {
            align-self: center;
            background: #1a3a1a;
            color: #8f8;
            font-size: 13px;
            border-radius: 8px;
        }

        .message.error {
            align-self: center;
            background: #3a1a1a;
            color: #f88;
            font-size: 13px;
            border-radius: 8px;
        }

        #input-area {
            background: #16213e;
            padding: 12px 24px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #0f3460;
        }

        #input-area input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }

        #input-area input[type="text"]:focus {
            border-color: #e94560;
        }

        #input-area input[type="text"]:disabled {
            opacity: 0.5;
        }

        #send-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        #send-btn:hover { background: #c73e54; }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #file-input { display: none; }

        .upload-btn {
            background: none;
            border: 1px solid #0f3460;
            color: #e0e0e0;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            transition: background 0.2s;
        }

        .upload-btn:hover { background: #0f3460; }

        #typing-indicator {
            display: none;
            align-self: flex-start;
            color: #888;
            font-size: 13px;
            padding: 6px 12px;
        }

        #typing-indicator.active { display: block; }

        .welcome {
            text-align: center;
            color: #666;
            margin-top: 30vh;
        }

        .welcome h2 { color: #e94560; margin-bottom: 8px; }
        .welcome p { font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <h1>🤖 Chat IA Local — Qwen 2.5</h1>
        <div class="actions">
            <button class="btn btn-danger" onclick="limparChat()">Limpar chat</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="welcome" id="welcome">
            <h2>Bem-vindo ao Chat IA Local</h2>
            <p>Digite uma mensagem ou envie um documento (.txt / .pdf) para começar.</p>
        </div>
    </div>

    <div id="input-area">
        <button class="upload-btn" onclick="document.getElementById('file-input').click()" title="Enviar documento">📎</button>
        <input type="file" id="file-input" accept=".txt,.pdf" onchange="uploadArquivo(this)">
        <input type="text" id="msg-input" placeholder="Digite sua mensagem..." autocomplete="off" onkeydown="if(event.key==='Enter') enviarMensagem()">
        <button id="send-btn" onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const welcome = document.getElementById('welcome');

        function addMessage(content, role, tempo) {
            if (welcome) welcome.style.display = 'none';
            const div = document.createElement('div');
            div.classList.add('message', role);
            div.textContent = content;
            if (tempo) {
                const t = document.createElement('div');
                t.classList.add('tempo');
                t.textContent = '⏱ ' + tempo;
                div.appendChild(t);
            }
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function setInputEnabled(enabled) {
            msgInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            if (enabled) msgInput.focus();
        }

        async function enviarMensagem() {
            const msg = msgInput.value.trim();
            if (!msg) return;

            msgInput.value = '';
            addMessage(msg, 'user');
            setInputEnabled(false);

            const assistantDiv = addMessage('', 'assistant');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem: msg })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = JSON.parse(line.substring(6));

                        if (data.error) {
                            assistantDiv.classList.remove('assistant');
                            assistantDiv.classList.add('error');
                            assistantDiv.textContent = '❌ ' + data.error;
                            break;
                        }

                        if (data.token) {
                            fullText += data.token;
                            assistantDiv.textContent = fullText;
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        }

                        if (data.done) {
                            const t = document.createElement('div');
                            t.classList.add('tempo');
                            t.textContent = '⏱ ' + data.tempo;
                            assistantDiv.appendChild(t);
                        }
                    }
                }
            } catch (err) {
                assistantDiv.classList.remove('assistant');
                assistantDiv.classList.add('error');
                assistantDiv.textContent = '❌ Erro de conexão: ' + err.message;
            }

            setInputEnabled(true);
        }

        async function uploadArquivo(input) {
            const file = input.files[0];
            if (!file) return;
            input.value = '';

            const formData = new FormData();
            formData.append('arquivo', file);

            addMessage('📎 Enviando documento: ' + file.name + '...', 'system');
            setInputEnabled(false);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    addMessage('❌ ' + data.error, 'error');
                } else {
                    addMessage('✅ Documento "' + data.filename + '" carregado (' + data.chars + ' caracteres). Pode fazer perguntas sobre ele.', 'system');
                }
            } catch (err) {
                addMessage('❌ Erro ao enviar arquivo: ' + err.message, 'error');
            }

            setInputEnabled(true);
        }

        async function limparChat() {
            try {
                await fetch('/limpar', { method: 'POST' });
                chatContainer.innerHTML = '';
                if (welcome) {
                    const w = document.createElement('div');
                    w.classList.add('welcome');
                    w.id = 'welcome';
                    w.innerHTML = '<h2>Bem-vindo ao Chat IA Local</h2><p>Digite uma mensagem ou envie um documento (.txt / .pdf) para começar.</p>';
                    chatContainer.appendChild(w);
                }
            } catch (err) {
                addMessage('❌ Erro ao limpar: ' + err.message, 'error');
            }
        }

        msgInput.focus();
    </script>
</body>
</html>
