{% extends "base.html" %}

{% block title %}Entrevista em Andamento - parCV{% endblock %}

{% block styles %}
<style>
    :root {
        /* Fundos — alinhados ao tema dark do Dashboard (parCV) */
        --bg-main: #0b0c10;
        --bg-card: #161722;

        /* Cores principais */
        --color-primary: #6366f1;
        --color-border: rgba(255, 255, 255, 0.06);
        --color-border-focus: #6366f1;

        /* Texto */
        --text-main: #ffffff;
        --text-muted: #a0a5b5;

        /* Estados */
        --color-success: #22c55e;
        --color-danger: #ef4444;
        --color-warning: #facc15;

        /* Bordas arredondadas */
        --radius-lg: 12px; 
        --radius-md: 8px;  

        /* Espaçamento */
        --spacing-xl: 24px; 
    }


    body {
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: system-ui, -apple-system, sans-serif;
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px var(--spacing-xl);
        border-bottom: 1px solid var(--color-border);
    }

    .header__left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .header__title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 700;
    }

    .ev-tracker {
        margin-bottom: var(--spacing-xl);
    }

    .ev-tracker__header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 14px;
    }

    .ev-tracker__label {
        color: var(--text-muted);
        font-weight: 500;
    }

    .ev-tracker__counter {
        color: var(--color-primary);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
    }

    .ev-main--exec {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 24px;
    }

    .ev-progress-bar {
        width: 100%;
        height: 6px;
        background: var(--color-border);
        border-radius: 3px;
        overflow: hidden;
    }

    .ev-progress-fill {
        height: 100%;
        background-color: var(--color-primary);
        transition: width 0.4s ease;
    }

    .ev-card {
        background: var(--bg-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--spacing-xl);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .ev-card--center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 60px var(--spacing-xl);
    }

    .ev-pergunta-meta {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
    }

    .ev-pergunta-meta--hard {
        background: rgba(99, 102, 241, 0.12);
        color: #a5b4fc;
    }

    .ev-pergunta-meta--soft {
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
    }

    .ev-pergunta-texto {
        font-size: 18px;
        line-height: 1.6;
        font-weight: 500;
        margin: 0 0 24px 0;
    }

    .form-group {
        margin-top: var(--spacing-xl);
    }

    .form-label {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
        display: block;
        margin-bottom: 8px;
    }

    .form-textarea {
        width: 100%;
        min-height: 160px;
        background: rgba(11, 12, 16, 0.6);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 16px;
        color: var(--text-main);
        font-family: inherit;
        font-size: 15px;
        resize: vertical;
        box-sizing: border-box;
        transition: border-color 0.2s;
    }

    .form-textarea:focus {
        outline: none;
        border-color: var(--color-border-focus);
    }

    .ev-alert {
        padding: 14px 16px;
        border-radius: var(--radius-md);
        font-size: 14px;
        margin-top: 24px;
    }

    .ev-alert--danger {
        background: rgba(213, 47, 47, 0.1);
        border: 1px solid var(--color-danger);
        color: #ffcdd2;
    }

    .ev-exec-actions {
        display: flex;
        justify-content: center;
        margin-top: var(--spacing-xl);
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        width: 100%;
        max-width: 320px;
    }

    .btn--primary {
        background-color: var(--color-primary);
        color: #FFFFFF;
    }

    .btn--primary:hover:not(:disabled) {
        background-color: var(--color-primary-hover, #7c7ff6);
        transform: translateY(-1px);
    }

    .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .ev-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: var(--color-primary);
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .ev-loading-text { color: var(--text-muted); font-size: 15px; }

    .ev-feedback-header {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        background: rgba(255, 255, 255, 0.02);
        padding: 24px;
        border-radius: var(--radius-md);
        border: 1px solid var(--color-border);
        transition: border-color 0.3s;
    }

    .ev-feedback-score {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(11, 12, 16, 0.8);
        border: 2px solid var(--color-border);
        border-radius: var(--radius-md);
        min-width: 80px;
        height: 80px;
        font-weight: 700;
        flex-shrink: 0;
    }

    #score-display span:first-child {
        font-size: 28px;
    }

    .ev-feedback-score__label {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: -2px;
    }

    .ev-feedback-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 8px;
        transition: color 0.3s;
    }

    .ev-feedback-texto {
        font-size: 14px;
        line-height: 1.6;
        color: #e0e0e0;
        margin: 0;
    }

    .hidden { display: none !important; }

    .btn-cancelar {
        background: rgba(239, 68, 68, 0.08);
        color: var(--color-danger);
        border: 1px solid rgba(239, 68, 68, 0.4);
        font-weight: 600;
        transition: background var(--transition, 0.2s ease), border-color var(--transition, 0.2s ease),
                    color var(--transition, 0.2s ease), transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-cancelar:hover {
        background: var(--color-danger);
        border-color: var(--color-danger);
        color: #ffffff;
        transform: translateY(-1px) scale(1.03);
        box-shadow: 0 6px 16px -2px rgba(239, 68, 68, 0.5);
    }

    .btn-cancelar:active {
        transform: translateY(0) scale(0.98);
    }
</style>
{% endblock %}

{% block body %}
<header class="header">
    <div class="header__left">
        <h1 class="header__title">
            <i data-lucide="mic"></i>
            Entrevista em Andamento
        </h1>
    </div>
    <div class="header__actions">
        <button type="button" class="btn btn-cancelar" id="btn-cancelar">
            <i data-lucide="x"></i>
            Cancelar Entrevista
        </button>
    </div>
</header>

<main class="ev-main ev-main--exec">
    <div class="ev-card ev-card--center" id="card-loading">
        <div class="ev-spinner"></div>
        <p class="ev-loading-text">Carregando pergunta...</p>
    </div>

    <div class="ev-card hidden" id="card-pergunta">
        <div class="ev-tracker">
            <div class="ev-tracker__header">
                <span class="ev-tracker__label">Progresso da Simulação</span>
                <span class="ev-tracker__counter" id="progresso-texto">1/10</span>
            </div>
            <div class="ev-progress-bar">
                <div class="ev-progress-fill" id="barra-preenchimento" style="width: 0%"></div>
            </div>
        </div>

        <div class="ev-pergunta-meta" id="pergunta-tema"></div>
        <p class="ev-pergunta-texto" id="pergunta-titulo"></p>

        <div class="form-group">
            <label class="form-label" for="resposta-input">Sua resposta</label>
            <textarea
                id="resposta-input"
                class="form-textarea"
                placeholder="Digite sua resposta aqui..."
            ></textarea>
        </div>

        <div id="error-resposta" class="ev-alert ev-alert--danger hidden"></div>

        <div class="ev-exec-actions">
            <button class="btn btn--primary" id="btn-enviar">
                <i data-lucide="send"></i>
                Enviar Resposta
            </button>
        </div>
    </div>

    <div class="ev-card hidden" id="card-feedback">
        <div class="ev-feedback-header">
            <div class="ev-feedback-score" id="score-display">
                <span id="score-valor">-</span>
                <span class="ev-feedback-score__label">/10</span>
            </div>
            <div>
                <h3 class="ev-feedback-title">Feedback da IA</h3>
                <p class="ev-feedback-texto" id="feedback-texto"></p>
            </div>
        </div>

        <div class="ev-exec-actions">
            <button class="btn btn--primary" id="btn-proxima">
                <i data-lucide="arrow-right"></i>
                Próxima Pergunta
            </button>
        </div>
    </div>
</main>

<script>
// ID extraído do template pelo Jinja — não depende da estrutura da URL
let entrevistaId = '{{ entrevista_id }}';
let perguntaAtual = 1;
let totalPerguntas = 5;
let entrevistaFinalizada = false;

// Aviso ao tentar sair no meio da entrevista
window.addEventListener('beforeunload', function(e) {
    if (!entrevistaFinalizada) {
        e.preventDefault();
        e.returnValue = 'Você tem uma entrevista em andamento. Tem certeza que quer sair?';
    }
});

document.getElementById('btn-cancelar').addEventListener('click', async () => {
    const confirmar = await confirmModal({
        title: 'Cancelar entrevista',
        message: 'Tem certeza que deseja cancelar a entrevista? Seu progresso será perdido.',
        confirmText: 'Cancelar entrevista',
        cancelText: 'Voltar',
        danger: true
    });
    if (!confirmar) return;
    entrevistaFinalizada = true; // evita o aviso de beforeunload
    window.location.href = '/entrevista';
});

async function carregarPergunta() {
    document.getElementById('card-pergunta').classList.add('hidden');
    document.getElementById('card-feedback').classList.add('hidden');
    document.getElementById('card-loading').classList.remove('hidden');

    try {
        const res = await fetch(`/entrevista/${entrevistaId}/pergunta/${perguntaAtual}`);
        if (!res.ok) throw new Error('Erro ao carregar pergunta');
        const data = await res.json();

        totalPerguntas = data.total_perguntas;
        document.getElementById('pergunta-titulo').textContent = data.pergunta_principal;
        const temaEl = document.getElementById('pergunta-tema');
        const isHard = (data.tema || '').toLowerCase().includes('hard');
        temaEl.textContent = data.tema || '';
        temaEl.className = 'ev-pergunta-meta ' + (isHard ? 'ev-pergunta-meta--hard' : 'ev-pergunta-meta--soft');
        document.getElementById('progresso-texto').textContent = `${perguntaAtual}/${totalPerguntas}`;
        document.getElementById('barra-preenchimento').style.width = `${((perguntaAtual - 1) / totalPerguntas) * 100}%`;
        document.getElementById('resposta-input').value = '';
        document.getElementById('error-resposta').classList.add('hidden');

        document.getElementById('card-loading').classList.add('hidden');
        document.getElementById('card-pergunta').classList.remove('hidden');
        document.getElementById('resposta-input').focus();
    } catch (err) {
        document.getElementById('card-loading').innerHTML =
            `<p class="ev-alert ev-alert--danger">${err.message}</p>`;
    }
}

document.getElementById('btn-enviar').addEventListener('click', async () => {
    const resposta = document.getElementById('resposta-input').value.trim();
    const errorEl = document.getElementById('error-resposta');
    errorEl.classList.add('hidden');

    if (!resposta) { errorEl.textContent = 'Digite sua resposta antes de enviar.'; errorEl.classList.remove('hidden'); return; }
    if (resposta.length > 2000) { errorEl.textContent = 'Resposta muito longa (máx. 2000 caracteres).'; errorEl.classList.remove('hidden'); return; }

    const btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader"></i> Enviando...';
    if (window.lucide) lucide.createIcons();

    try {
        const res = await fetch(`/entrevista/${entrevistaId}/responder`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ numero_sequencial: perguntaAtual, resposta, tipo: 'principal' })
        });
        if (!res.ok) throw new Error('Erro ao enviar resposta');
        const data = await res.json();

        const score = data.score || 0;
        const scoreEl = document.getElementById('score-valor');
        scoreEl.textContent = score;
        
        let cor;
        if (score >= 9.0)      cor = '#22c55e';
        else if (score >= 7.0) cor = '#3b82f6';
        else if (score >= 5.0) cor = '#facc15';
        else if (score >= 3.0) cor = '#fb923c';
        else                   cor = '#ef4444';
        
        scoreEl.style.color = cor;
        document.getElementById('score-display').style.borderColor = cor;
        const feedbackHeader = document.querySelector('.ev-feedback-header');
        feedbackHeader.style.borderColor = cor;
        feedbackHeader.querySelector('.ev-feedback-title').style.color = cor;
        document.getElementById('feedback-texto').textContent = data.feedback_ia || '';

        const btnProxima = document.getElementById('btn-proxima');
        const isUltima = perguntaAtual >= totalPerguntas;
        btnProxima.innerHTML = isUltima
            ? '<i data-lucide="flag"></i> Finalizar e ver relatório'
            : '<i data-lucide="arrow-right"></i> Próxima Pergunta';
        btnProxima.onclick = isUltima ? finalizarEntrevista : proximaPergunta;

        document.getElementById('barra-preenchimento').style.width = `${(perguntaAtual / totalPerguntas) * 100}%`;

        document.getElementById('card-pergunta').classList.add('hidden');
        document.getElementById('card-feedback').classList.remove('hidden');
        if (window.lucide) lucide.createIcons();
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="send"></i> Enviar Resposta';
        if (window.lucide) lucide.createIcons();
    }
});

function proximaPergunta() {
    perguntaAtual++;
    carregarPergunta();
}

async function finalizarEntrevista() {
    const btn = document.getElementById('btn-proxima');
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader"></i> Gerando relatório...';
    if (window.lucide) lucide.createIcons();
    try {
        const res = await fetch(`/entrevista/${entrevistaId}/finalizar`, { method: 'POST' });
        if (!res.ok) throw new Error('Erro ao finalizar');
        entrevistaFinalizada = true;
        window.location.href = `/entrevista/${entrevistaId}/relatorio`;
    } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="flag"></i> Finalizar e ver relatório';
        alert('Erro: ' + err.message);
    }
}

window.addEventListener('load', carregarPergunta);
</script>
{% endblock %}
