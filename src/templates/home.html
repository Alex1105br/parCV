{% extends "base.html" %}

{% block title %}Dashboard - IA Currículos{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
{% endblock %}

{% block body %}
<button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
</button>

<aside class="sidebar sidebar--hidden" id="sidebar" aria-label="Menu de navegação">
    <nav>
        <a href="/" class="sidebar__item sidebar__item--active" aria-current="page">
            <span class="sidebar__icon">⌂</span>
            <span class="sidebar__label">Página inicial</span>
        </a>
        <a href="/analisar" class="sidebar__item">
            <span class="sidebar__icon">🗎</span>
            <span class="sidebar__label">Meus currículos</span>
        </a>
    </nav>
</aside>

<main class="main-content">
    <div class="container">
        <h1 class="page-title">Serviços</h1>

        <div class="card-grid">
            <a href="/analisar" class="card">
                <span class="card__icon">🔎</span>
                <span class="card__label">Analisar currículo</span>
            </a>

            <a href="/chat" class="card">
                <span class="card__icon">👤</span>
                <span class="card__label">Simulação entrevista</span>
            </a>
        </div>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='home.js') }}"></script>
{% endblock %}
