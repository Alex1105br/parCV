{% extends "base.html" %}

{% block title %}Detalhe da Análise - parCV{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='analisar.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='historico.css') }}">
{% endblock %}

{% block body %}
<header class="header">
    <div class="header__left">
        <a href="/historico" class="header__home" aria-label="Voltar ao histórico">
            <i data-lucide="arrow-left"></i>
        </a>
        <h1 class="header__title">
            <i data-lucide="scan-search"></i>
            Detalhe da Análise
        </h1>
    </div>
    <div class="header__actions">
        <a href="/analisar" class="btn btn--primary">
            <i data-lucide="plus"></i>
            Nova análise
        </a>
    </div>
</header>

<div id="page-content">
    <div class="detalhe-loader">
        <span class="loader__bar"></span>
        <span>Carregando análise...</span>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.ANALISE_ID = {{ analise_id | tojson }};
</script>
<script src="{{ url_for('static', filename='historico_detalhe.js') }}"></script>
{% endblock %}
