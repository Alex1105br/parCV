{% extends "base.html" %}

{% block title %}Login - parCV{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
{% endblock %}

{% block body %}
<div class="container">
    <div class="card">
        <div class="brand">
            <i data-lucide="brain-circuit" class="brand__logo"></i>
            <span class="brand__text">parCV</span>
        </div>

        <h1>Login</h1>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('auth.login') }}" novalidate>
            <input type="email" name="email" placeholder="Email" value="{{ request.form.email or '' }}" required>
            <input type="password" name="password" placeholder="Senha" required>
            <button class="btn-primary" type="submit">Entrar</button>
        </form>

        <a class="btn-secondary" href="{{ url_for('auth.register') }}">Criar conta</a>
    </div>
</div>
{% endblock %}
